  name: fleet_control
  description: "Fleet Control App - Monitoreo de flotas"
  publish_to: 'none'
  version: 2.0.0+1

  environment:
    sdk: ^3.12.2

  dependencies:
    flutter:
      sdk: flutter

    # UI
    cupertino_icons: ^1.0.8

    # Estado y navegación
    flutter_riverpod: ^2.6.1
    go_router: ^16.0.0

    # Networking
    dio: ^5.9.0

    # Persistencia
    shared_preferences: ^2.5.3
    flutter_secure_storage: ^10.0.0-beta.4

    # Utilidades
    intl: ^0.20.2
    uuid: ^4.5.1
    file_picker: ^10.3.10
    excel: ^4.0.6
    pdf: ^3.11.3
    printing: ^5.14.2

    # Mapas y geolocalización
    flutter_map: ^7.0.2
    latlong2: ^0.9.1
    geolocator: ^14.0.2
    url_launcher: ^6.3.2
    firebase_core: ^4.5.0
    firebase_messaging: ^16.1.2

  dev_dependencies:
    flutter_test:
      sdk: flutter
    flutter_lints: ^6.0.0

  flutter:
    uses-material-design: true

    assets:
      - assets/images/
      - assets/icons/
